[project]
name = "rag-medical"
version = "0.5.0"
description = "Medical RAG"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "sentence-transformers==5.1.1",
    "transformers==4.56.2",
    "numpy==2.3.3",
    "scikit-learn==1.7.2",
    "pandas==2.3.3",
    "torch==2.8.0",
    "huggingface-hub==0.36.0",
    "requests==2.32.5",
    "tqdm==4.67.1",
    "beautifulsoup4==4.14.2",
    "chromadb==1.5.9",
    "vllm-metal==0.1.0; sys_platform == 'darwin'",
    "mlx==0.31.2",
    "rank-bm25==0.2.2",
    "openai==2.37.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff",
    "ipykernel",
]

[tool.uv]
managed = true
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
